services:
  mysql:
    image: mysql:8.4
    container_name: finintel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - finintel_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: finintel-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: finintel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  financial-data-service:
    build:
      context: ../backend/financial-data-service
    container_name: financial-data-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/financial_data_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SEC_USER_AGENT: FinIntel/1.0 your-email@example.com
      SHOW_SQL: false
    ports:
      - "8081:8081"

  financial-analytics-service:
    build:
      context: ../backend/financial-analytics-service
    container_name: financial-analytics-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      financial-data-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/financial_analytics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      FINANCIAL_DATA_BASE_URL: http://financial-data-service:8081
      SHOW_SQL: false
    ports:
      - "8082:8082"

  ai-analysis-service:
    build:
      context: ../backend/ai-analysis-service
    container_name: ai-analysis-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      financial-data-service:
        condition: service_started
      financial-analytics-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_analysis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FINANCIAL_DATA_BASE_URL: http://financial-data-service:8081
      FINANCIAL_ANALYTICS_BASE_URL: http://financial-analytics-service:8082
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.6-flash
      SHOW_SQL: false
    ports:
      - "8083:8083"

volumes:
  finintel_mysql_data: