server:
  port: 8081

spring:
  application:
    name: financial-data-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/financial_data_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

sec:
  api:
    company-tickers-url: https://www.sec.gov/files/company_tickers.json
    company-facts-url-template: https://data.sec.gov/api/xbrl/companyfacts/CIK%s.json
    user-agent: ${SEC_USER_AGENT:FinIntel/1.0 pliubelfast@gmail.com}
